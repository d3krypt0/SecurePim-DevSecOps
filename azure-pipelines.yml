trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore SecurePim.slnx
    displayName: Restore and audit dependencies

  - script: dotnet build SecurePim.slnx --configuration $(buildConfiguration) --no-restore
    displayName: Build with analyzers

  - script: dotnet test SecurePim.slnx --configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage"
    displayName: Run tests

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
